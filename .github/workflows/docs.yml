name: Docs

# Builds the DocFX site - the API reference from the XML comments of the eight projects, plus
# the documents under docs/ as articles - and publishes it to GitHub Pages on every push to
# main. Repository Settings -> Pages -> Source must be "GitHub Actions".
#
# This workflow builds the site only; build.yml does the tests and the releases. DocFX
# restores and compiles the projects itself to read the comments, and that is the only
# compiling here. gen_toc.py --check fails the run when docfx.json's article list or toc.yml
# is stale against the tracked files, so a document added without rerunning the script is
# caught here rather than silently missing from the tree.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build DocFX site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@v6

      - name: Article list and page tree match the tracked files
        run: python src/docfx/gen_toc.py --check

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build site
        working-directory: src
        run: docfx docfx/docfx.json --warningsAsErrors

      - uses: actions/upload-pages-artifact@v5
        with:
          path: src/docfx/_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

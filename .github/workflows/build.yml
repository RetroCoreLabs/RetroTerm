# Build and test on every push and pull request. This is what the build badge in README.md
# reports, so the badge can go red - a badge that cannot is decoration.
#
# windows-latest because RetroTerm.Tests targets net10.0-windows and the UI is Avalonia on
# Windows. SDK 10.x, pinned by global.json, because that is what the repository is actually built
# with on the development machine (10.0.401); the projects target net10.0 since 28 September 2026.
name: build
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The outside conformance corpora are fetched, never committed, and 160-odd tests plus
      # every corpus-driven theory case only exist when they are present. Without this step the
      # first run on GitHub counted 6,746 tests where the development machine counts 6,906.
      # The token only raises the GitHub API rate limit for the directory listings.
      - run: pwsh tools/fetch-conformance-corpora.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: dotnet restore src/RetroTerm.slnx
      - run: dotnet build src/RetroTerm.slnx -c Release --no-restore -nodeReuse:false
      # The main suite takes about two and a half minutes locally.
      - run: dotnet test src/RetroTerm.slnx -c Release --no-build -nodeReuse:false --logger "console;verbosity=minimal"

# Build and test on every push and pull request, publish a self-contained binary for every
# platform, and turn a v* tag into a release carrying those binaries.
#
# THREE JOBS, in plain words:
#
#   build    The badge in README.md. Windows only, because RetroTerm.Tests targets
#            net10.0-windows: the headless Avalonia tests render real pixels and the bell test
#            talks to winmm. Fetches the outside conformance corpora first, so the corpus tests
#            run here instead of being absent - the first run on GitHub counted 6,746 tests where
#            the development machine counts 6,906, and that step is the difference.
#
#   publish  One self-contained single-file RetroTerm per runtime: win-x64, linux-x64, osx-x64
#            and osx-arm64, each built ON ITS OWN operating system's runner so the native
#            libraries Avalonia and SkiaSharp unpack at first start are the ones that runner
#            verified. The Kermit test project targets plain net10.0 and runs on every one of
#            them, which is the one test suite that can prove the code on Linux and macOS at
#            all. Windows is also proved by the build job above. The binaries are workflow
#            artifacts, 90 days.
#
#   release  Only on a tag matching v*. Downloads the four artifacts and attaches them to a
#            GitHub release for that tag, which is what fills the release and download badges.
#
# SDK 10.x, pinned by global.json, because that is what the repository is actually built with
# on the development machine (10.0.401); the projects target net10.0 since 28 September 2026.
#
# The macOS binaries are bare Mach-O executables, not .app bundles, and none of the binaries
# is code-signed or notarised. macOS Gatekeeper will refuse an unsigned download until the
# quarantine attribute is removed; the release notes say so.
name: build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The token only raises the GitHub API rate limit for the directory listings.
      - run: pwsh tools/fetch-conformance-corpora.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: dotnet restore src/RetroTerm.slnx
      - run: dotnet build src/RetroTerm.slnx -c Release --no-restore -nodeReuse:false
      # The main suite takes about two and a half minutes locally.
      - run: dotnet test src/RetroTerm.slnx -c Release --no-build -nodeReuse:false --logger "console;verbosity=minimal"

  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: RetroTerm.Desktop.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: RetroTerm.Desktop
          - os: macos-13
            rid: osx-x64
            binary: RetroTerm.Desktop
          - os: macos-latest
            rid: osx-arm64
            binary: RetroTerm.Desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The one test project with no Windows dependency, run on the platform being shipped.
      - run: dotnet test tests/RetroTerm.Core.Protocols.Kermit.Tests/RetroTerm.Core.Protocols.Kermit.Tests.csproj -c Release -nodeReuse:false --logger "console;verbosity=minimal"
      - run: dotnet publish src/RetroTerm.Desktop/RetroTerm.Desktop.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }} -nodeReuse:false
      # The binary is renamed to carry its runtime, so four artifacts do not all unpack to the
      # same file name when downloaded together.
      - name: Name the binary by runtime
        shell: bash
        run: |
          cd out/${{ matrix.rid }}
          ls -la
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv RetroTerm.Desktop.exe RetroTerm-${{ matrix.rid }}.exe
          else
            mv RetroTerm.Desktop RetroTerm-${{ matrix.rid }}
            chmod +x RetroTerm-${{ matrix.rid }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RetroTerm-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/RetroTerm-${{ matrix.rid }}*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release with the four binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -laR artifacts
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "RetroTerm ${{ github.ref_name }}" \
            --notes "Self-contained single-file builds. Nothing to install.

          - RetroTerm-win-x64.exe: Windows x64.
          - RetroTerm-linux-x64: Linux x64. Run: chmod +x RetroTerm-linux-x64 && ./RetroTerm-linux-x64
          - RetroTerm-osx-x64 and RetroTerm-osx-arm64: macOS on Intel and on Apple silicon. Unsigned, so after downloading run: xattr -d com.apple.quarantine RetroTerm-osx-arm64 && chmod +x RetroTerm-osx-arm64 && ./RetroTerm-osx-arm64

          Every build hosts the MCP server on http://127.0.0.1:5715/mcp; see docs/DISTRIBUTION-README.md." \
            artifacts/RetroTerm-win-x64/RetroTerm-win-x64.exe \
            artifacts/RetroTerm-linux-x64/RetroTerm-linux-x64 \
            artifacts/RetroTerm-osx-x64/RetroTerm-osx-x64 \
            artifacts/RetroTerm-osx-arm64/RetroTerm-osx-arm64

# Build and test on every push and pull request, publish a self-contained binary for every
# platform, and turn a v* tag into a release carrying those binaries.
#
# THREE JOBS, in plain words:
#
#   build    The badge in README.md. Windows only, because RetroTerm.Tests targets
#            net10.0-windows: the headless Avalonia tests render real pixels and the bell test
#            talks to winmm. Fetches the outside conformance corpora first, so the corpus tests
#            run here instead of being absent - the first run on GitHub counted 6,746 tests where
#            the development machine counts 6,906, and that step is the difference.
#
#   publish  One self-contained single-file RetroTerm per runtime: win-x64, linux-x64, osx-x64
#            and osx-arm64, each built ON ITS OWN operating system's runner so the native
#            libraries Avalonia and SkiaSharp unpack at first start are the ones that runner
#            verified. The Kermit test project targets plain net10.0 and runs on every one of
#            them, which is the one test suite that can prove the code on Linux and macOS at
#            all. Windows is also proved by the build job above. The binaries are workflow
#            artifacts, 90 days.
#
#   release  Only on a tag matching v*. Downloads the four artifacts and attaches them to a
#            GitHub release for that tag, which is what fills the release and download badges.
#
# SDK 10.x, pinned by global.json, because that is what the repository is actually built with
# on the development machine (10.0.401); the projects target net10.0 since 28 September 2026.
#
# macOS x64 runs on macos-15-intel: the macos-13 image the first version of this named had been
# retired, and the job sat queued with no runner until that was noticed on 28 September 2026.
# The list of live images is the README of github.com/actions/runner-images.
#
# What each platform gets, since 30 September 2026 (before that all four were bare binaries, and
# macOS and Linux showed no icon anywhere):
#   Windows  RetroTerm-win-x64.zip holding a RetroTerm-win-x64 folder - RetroTerm.exe (the icon is
#            compiled into it) and the three distribution files below.
#   macOS    RetroTerm-osx-*.zip holding RetroTerm.app - Info.plist from src/packaging/macos/ and an
#            .icns rendered from src/assets/RetroTerm.svg. Signed ad hoc, not notarised: Gatekeeper
#            refuses a downloaded copy until the quarantine attribute is removed; the release
#            notes say so.
#   Linux    RetroTerm-linux-x64.tar.gz - the program, retroterm.desktop, the icon at the hicolor
#            sizes rendered from the same SVG, and install.sh from src/packaging/linux/.
# The SVG is the one source for every icon size on macOS and Linux.
#
# Every platform's download also carries the three files docs/DISTRIBUTION-README.md describes
# (BUGS.md B19, fixed 24 November 2026 - before that the release held only the program):
#   README.md                   docs/DISTRIBUTION-README.md
#   .mcp.json                   docs/distribution-mcp.json
#   add-mcp-to-claude-code.ps1  src/tools/add-mcp-to-claude-code.ps1
# The step "Distribution files" copies them into out/dist, and each platform's packaging step
# takes them from there, so the list is in one place.
name: build
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The token only raises the GitHub API rate limit for the directory listings.
      - run: pwsh src/tools/fetch-conformance-corpora.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # nuget.config reads these two values to log in to the RetroIO feed on GitHub Packages.
      - run: dotnet restore src/RetroTerm.slnx
        env:
          RETROCORE_NUGET_USER: ${{ github.actor }}
          RETROCORE_NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet build src/RetroTerm.slnx -c Release --no-restore -nodeReuse:false
      # The main suite takes about two and a half minutes locally.
      # The Hercules tests drive a live TK5 mainframe (src/tests/RetroTerm.Tests/Hercules); a hosted
      # runner has none, so they are a separate gate run where TK5 is up. They are not skipped there:
      # they FAIL when the host does not answer.
      # The Ffmpeg tests make an MP4 with a real ffmpeg and read it back with ffprobe
      # (Recording/RecordStopMp4Tests); they FAIL, naming what is missing, where there is none, so
      # like Hercules and Oracle they are run where ffmpeg is installed rather than here.
      - run: dotnet test src/RetroTerm.slnx -c Release --no-build -nodeReuse:false --filter "Category!=Hercules&Category!=Oracle&Category!=Ffmpeg" --logger "console;verbosity=minimal"

  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset is the one file each runner hands to the release job.
          - os: windows-latest
            rid: win-x64
            binary: RetroTerm.exe
            asset: RetroTerm-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            binary: RetroTerm.Desktop
            asset: RetroTerm-linux-x64.tar.gz
          - os: macos-15-intel
            rid: osx-x64
            binary: RetroTerm.Desktop
            asset: RetroTerm-osx-x64.zip
          - os: macos-latest
            rid: osx-arm64
            binary: RetroTerm.Desktop
            asset: RetroTerm-osx-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The one test project with no Windows dependency, run on the platform being shipped.
      - run: dotnet test src/tests/RetroTerm.Core.Protocols.Kermit.Tests/RetroTerm.Core.Protocols.Kermit.Tests.csproj -c Release -nodeReuse:false --logger "console;verbosity=minimal"
        env:
          RETROCORE_NUGET_USER: ${{ github.actor }}
          RETROCORE_NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet publish src/RetroTerm.Desktop/RetroTerm.Desktop.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }} -nodeReuse:false
        env:
          RETROCORE_NUGET_USER: ${{ github.actor }}
          RETROCORE_NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The binary is renamed to carry its runtime, so four artifacts do not all unpack to the
      # same file name when downloaded together.
      - name: Name the binary by runtime
        shell: bash
        run: |
          cd out/${{ matrix.rid }}
          ls -la
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            mv RetroTerm.exe RetroTerm-${{ matrix.rid }}.exe
          else
            mv RetroTerm.Desktop RetroTerm-${{ matrix.rid }}
            chmod +x RetroTerm-${{ matrix.rid }}
          fi

      # The three files every download carries beside the program (see the header).
      - name: Distribution files
        shell: bash
        run: |
          set -e
          mkdir -p out/dist
          cp docs/DISTRIBUTION-README.md out/dist/README.md
          cp docs/distribution-mcp.json out/dist/.mcp.json
          cp src/tools/add-mcp-to-claude-code.ps1 out/dist/add-mcp-to-claude-code.ps1
          ls -la out/dist

      # Windows ships the exe in a zip with the distribution files: its icon is compiled into it
      # from RetroTerm.ico. Inside the zip it is RetroTerm.exe again, the name the README uses.
      # ZipFile.CreateFromDirectory takes every file, .mcp.json included.
      - name: Windows - build the zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'out/pkg/RetroTerm-win-x64'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item out/win-x64/RetroTerm-win-x64.exe "$pkg/RetroTerm.exe"
          Copy-Item out/dist/* $pkg -Force
          Copy-Item out/dist/.mcp.json $pkg -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path 'out/pkg').Path + '/RetroTerm-win-x64', (Join-Path (Resolve-Path 'out').Path '${{ matrix.asset }}'), 'Optimal', $true)

      # macOS only shows an icon for a .app bundle, so the binary goes into RetroTerm.app with an
      # Info.plist and an .icns rendered from src/assets/RetroTerm.svg - every size of the iconset,
      # 16 to 1024, is drawn from the SVG rather than scaled from a bitmap. The bundle is signed
      # ad hoc (no identity), which is what Apple silicon needs to start it at all; it is NOT
      # notarised, so a downloaded copy still carries the quarantine flag.
      - name: macOS - build RetroTerm.app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          brew install librsvg
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props | head -1)
          app=out/pkg/RetroTerm.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp out/${{ matrix.rid }}/RetroTerm-${{ matrix.rid }} "$app/Contents/MacOS/RetroTerm"
          chmod +x "$app/Contents/MacOS/RetroTerm"
          sed "s/__VERSION__/$version/g" src/packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          iconset=out/RetroTerm.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            rsvg-convert -w $s -h $s src/assets/RetroTerm.svg -o "$iconset/icon_${s}x${s}.png"
            rsvg-convert -w $((s*2)) -h $((s*2)) src/assets/RetroTerm.svg -o "$iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/RetroTerm.icns"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          cp out/dist/README.md out/dist/.mcp.json out/dist/add-mcp-to-claude-code.ps1 out/pkg/
          # The zip holds RetroTerm.app and the three distribution files side by side.
          (cd out/pkg && ditto -c -k --sequesterRsrc . ../${{ matrix.asset }})
          find "$app" -type f -exec ls -la {} \;

      # Linux shows an icon through a .desktop file in the user's application menu, so the
      # archive carries the program, the menu entry, the icon at the usual hicolor sizes (all
      # rendered from src/assets/RetroTerm.svg, plus the SVG itself as the scalable one) and
      # install.sh, which puts the three in place under ~/.local/share.
      - name: Linux - build the tar.gz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update -q
          sudo apt-get install -y -q librsvg2-bin
          pkg=out/pkg/RetroTerm-linux-x64
          mkdir -p "$pkg"
          cp out/linux-x64/RetroTerm-linux-x64 "$pkg/RetroTerm"
          cp src/packaging/linux/retroterm.desktop src/packaging/linux/install.sh "$pkg/"
          cp out/dist/README.md out/dist/.mcp.json out/dist/add-mcp-to-claude-code.ps1 "$pkg/"
          chmod +x "$pkg/RetroTerm" "$pkg/install.sh"
          for s in 16 24 32 48 64 128 256 512; do
            mkdir -p "$pkg/icons/${s}x${s}"
            rsvg-convert -w $s -h $s src/assets/RetroTerm.svg -o "$pkg/icons/${s}x${s}/retroterm.png"
          done
          mkdir -p "$pkg/icons/scalable"
          cp src/assets/RetroTerm.svg "$pkg/icons/scalable/retroterm.svg"
          tar -C out/pkg -czf out/${{ matrix.asset }} RetroTerm-linux-x64
          tar -tvzf out/${{ matrix.asset }}

      # Refuse to hand on a download that lacks any of the distribution files.
      - name: Check the download holds the distribution files
        shell: bash
        run: |
          set -e
          case "${{ matrix.asset }}" in
            *.tar.gz) list=$(tar -tzf out/${{ matrix.asset }}) ;;
            *.zip)    list=$(unzip -Z1 out/${{ matrix.asset }}) ;;
          esac
          echo "$list"
          for f in README.md .mcp.json add-mcp-to-claude-code.ps1; do
            echo "$list" | grep -E "(^|/)${f//./\.}$" > /dev/null || { echo "missing from the download: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: RetroTerm-${{ matrix.rid }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the release with the four downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -laR artifacts
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "RetroTerm ${{ github.ref_name }}" \
            --notes "Self-contained builds, no .NET runtime needed.

          - RetroTerm-win-x64.zip: Windows x64. Unzip it and run RetroTerm.exe; it is a single self-contained exe.
          - RetroTerm-osx-arm64.zip (Apple silicon) and RetroTerm-osx-x64.zip (Intel): unzip to get RetroTerm.app and drag it into Applications. It is not notarised, so the first time run: xattr -dr com.apple.quarantine /Applications/RetroTerm.app
          - RetroTerm-linux-x64.tar.gz: Linux x64. tar -xzf RetroTerm-linux-x64.tar.gz && cd RetroTerm-linux-x64 && ./install.sh puts RetroTerm in the application menu with its icon (under ~/.local/share, no root). ./RetroTerm also runs it straight from the folder.

          Every build hosts the MCP server on http://127.0.0.1:5715/mcp. Each download carries README.md, .mcp.json (a Claude Code project configuration for that server) and add-mcp-to-claude-code.ps1." \
            artifacts/RetroTerm-win-x64/RetroTerm-win-x64.zip \
            artifacts/RetroTerm-linux-x64/RetroTerm-linux-x64.tar.gz \
            artifacts/RetroTerm-osx-x64/RetroTerm-osx-x64.zip \
            artifacts/RetroTerm-osx-arm64/RetroTerm-osx-arm64.zip

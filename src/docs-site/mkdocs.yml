# RetroTerm documentation site - https://retrocorelabs.github.io/RetroTerm/
#
# Tool: MkDocs + Material. Chosen 18 October 2026 by the repository-aware rule in the house
# standard (repo-standards, standards/DOCS-SITE.md, section 1): RetroTerm had no site, its
# documentation is prose - user guides, terminal references and the transcribed manuals in
# docs/spec - and its libraries are not published, so a generated C# API reference is not
# central. One generator only; no DocFX beside this.
#
# Shape A of the standard: the repository IS the docs folder (docs_dir points at the repo
# root), so README.md and the documents under docs/ are pages without being copied. The
# folder sits under src/ because the repository root holds only the GitHub items and docs/.
#
# This file holds the hand-written settings only. The nav and the exclusion list are
# GENERATED into generated/mkdocs.yml by gen_nav.py from `git ls-files` and the policy
# written in that script; build the site from the generated file, never from this one:
#
#     python src/docs-site/gen_nav.py
#     mkdocs build --strict -f src/docs-site/generated/mkdocs.yml -d <folder outside the checkout>
#
# MkDocs refuses a site output inside docs_dir, and docs_dir is the whole checkout, so the
# -d folder must be elsewhere.

site_name: RetroTerm
site_description: "A terminal emulator for Norsk Data, DEC and Tektronix terminals: TDV2200, VT100 to VT420, Sixel, ReGIS, Kermit, MCP scripting."
site_url: https://retrocorelabs.github.io/RetroTerm/
repo_url: https://github.com/RetroCoreLabs/RetroTerm
repo_name: RetroCoreLabs/RetroTerm
edit_uri: blob/main/
copyright: "Copyright (c) 1985-2026 Ronny Hansen - MIT License - RetroCore Labs"

# Set by the generated child file (docs_dir, nav, exclude_docs). Kept out of here on purpose
# so a hand edit can never disagree with what the script derived from the tracked files.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Light
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Dark
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.prune
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.action.edit

plugins:
  - search

# Relative to the file being BUILT, which is generated/mkdocs.yml, hence the ../ (measured:
# "hooks.py" alone was looked for in generated/ and the build aborted).
hooks:
  - ../hooks.py

markdown_extensions:
  - toc:
      permalink: true
      # Same #anchors as github.com, so a link copied from either place works on both.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  # GitHub-style two-space nested lists; plain MkDocs flattens them.
  - mdx_truly_sane_lists:
      nested_indent: 2

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: info
  # A link to a page that does not exist is a WARNING, and --strict turns a warning into a
  # failed build. Links to files that are deliberately not on the site (PDFs, source, the
  # working notes) are rewritten to github.com by hooks.py before this check sees them.
  not_found: warn

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer bracket: top-right → left → down → right -->
  <path d="M 80,25 L 25,25 L 25,80 L 60,80" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner bracket: parallel, 12 units inward (was 15) -->
  <path d="M 80,37 L 37,37 L 37,68 L 60,68" fill="none" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Closed cap at start (right side) -->
  <path d="M 80,25 L 80,37" fill="none" stroke="#000" stroke-width="1.5"/>
  <!-- Arrowhead with barbs: wing tips connect back to body ends -->
  <path d="M 60,68 L 60,58 L 80,74 L 60,90 L 60,80" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

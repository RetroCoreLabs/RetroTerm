<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Outer bezel gradient -->
    <linearGradient id="bezelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3A"/>
      <stop offset="20%" stop-color="#222222"/>
      <stop offset="80%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>

    <!-- Bezel inner shadow for recess -->
    <linearGradient id="innerBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- CRT screen body -->
    <radialGradient id="screenBody" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#005533"/>
      <stop offset="80%" stop-color="#001911"/>
      <stop offset="100%" stop-color="#000A05"/>
    </radialGradient>

    <!-- Curvature reflection overlay -->
    <radialGradient id="screenReflection" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Blue reflection for bezel -->
    <radialGradient id="edgeGlow" cx="50%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#4169E1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4169E1" stop-opacity="0"/>
    </radialGradient>

    <!-- CRT glow -->
    <filter id="crtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer bezel -->
  <rect width="512" height="512" rx="60" fill="url(#bezelGradient)"/>

  <!-- Screen recess shadow -->
  <rect x="55" y="55" width="402" height="402" rx="28" fill="url(#innerBezel)"/>

  <!-- Screen background (with curvature) -->
  <rect x="60" y="60" width="392" height="392" rx="25" fill="url(#screenBody)"/>

  <!-- Curved glass reflection overlay -->
  <rect x="60" y="60" width="392" height="392" rx="25" fill="url(#screenReflection)"/>

  <!-- Blue edge reflection -->
  <rect x="60" y="60" width="392" height="392" rx="25" fill="url(#edgeGlow)"/>

  <!-- Terminal text -->
  <text x="85" y="305"
        font-family="JetBrains Mono, Consolas, monospace"
        font-size="120"
        font-weight="500"
        fill="#00FF88"
        filter="url(#crtGlow)">
    &gt;RT_
  </text>
</svg>
